<script>
const { jsPDF } = window.jspdf;
let state = {
    dados: {}, meta: {},
    indice: 'iip',
    ciclo: 'ANO',
    tipo: 'espacial', // Novo estado
    mapas: {}
};

let renderToken = 0;



// Variáveis para guardar as instâncias dos gráficos e permitir destruí-las depois
let chartST = null;
let chartBoxplot = null;
let chartAnual = null;

function renderGraficosTemporais() {
    if (state.tipo !== 'temporal') return;

    const anosOrdenados = Object.keys(state.meta).sort((a, b) => a - b);

    const labelsST = [];
    const dadosST = [];
    const dadosPorCiclo = { 0: [], 1: [], 2: [], 3: [], 4: [] }; 
    const labelsAnual = [];
    const dadosAnual = [];

    // === DEFINIÇÃO DE CORES DINÂMICAS ===
    const coresPorIndice = {
        'iip': { border: '#0e945c', bg: 'rgba(14, 148, 92, 0.2)', bgSolid: '#0e945c' },  // Verde
        'bre': { border: '#0d6efd', bg: 'rgba(13, 110, 253, 0.2)', bgSolid: '#0d6efd' }, // Azul
        'alb': { border: '#fd7e14', bg: 'rgba(253, 126, 20, 0.2)', bgSolid: '#fd7e14' }  // Laranja
    };
    
    const cor = coresPorIndice[state.indice];
    const isAlb = state.indice === 'alb';

    const nomeIndice = state.indice === 'iip' ? 'Infestação Predial (%)' : 
                       state.indice === 'bre' ? 'Índice de Breteau' : 'Aedes Albopictus (Soma)';

    anosOrdenados.forEach(ano => {
        if (!state.dados[ano]) return;

        // CÁLCULO DA SÉRIE TEMPORAL E BOXPLOT
        const ciclos = state.meta[ano] || [];
        ciclos.forEach((cicloObj, idx) => {
            let somaCidadeCiclo = 0;
            let countBairrosCiclo = 0;
            
            Object.values(state.dados[ano]).forEach(d => {
                if (d && d[idx]) {
                    const val = d[idx][state.indice];
                    if (val !== null && val !== undefined) {
                        somaCidadeCiclo += val;
                        countBairrosCiclo++;
                        dadosPorCiclo[idx].push(val); 
                    }
                }
            });

            if (countBairrosCiclo > 0) {
                const mediaCiclo = isAlb ? somaCidadeCiclo : (somaCidadeCiclo / countBairrosCiclo);
                labelsST.push(`${ano} - ${cicloObj.id}`);
                dadosST.push(mediaCiclo.toFixed(2));
            }
        });

        // CÁLCULO ANUAL
        let somaCidadeAno = 0;
        let countBairrosAno = 0;

        Object.values(state.dados[ano]).forEach(d => {
            if (d && d.length > 0) {
                let somaBairro = 0;
                d.forEach(c => somaBairro += (c[state.indice] || 0));
                
                const valBairroAno = isAlb ? somaBairro : (somaBairro / d.length);
                somaCidadeAno += valBairroAno;
                countBairrosAno++;
            }
        });

        if (countBairrosAno > 0) {
            const mediaAno = isAlb ? somaCidadeAno : (somaCidadeAno / countBairrosAno);
            labelsAnual.push(ano);
            dadosAnual.push(mediaAno.toFixed(2));
        }
    });

    // DESTRUIR GRÁFICOS ANTIGOS
    if (chartST) chartST.destroy();
    if (chartBoxplot) chartBoxplot.destroy();
    if (chartAnual) chartAnual.destroy();

    // === CONFIGURAÇÃO DAS ÁREAS DE FUNDO E LINHAS DE LIMITE ===
    let annotationsConfig = {};
    if (!isAlb) {
        annotationsConfig = {
            // 1. Faixa Verde de Fundo (Abaixo de 1)
            faixaSatisfatorio: {
                type: 'box',
                yMin: 0,
                yMax: 1,
                backgroundColor: 'rgba(25, 135, 84, 0.08)', // Verde bem translúcido
                borderWidth: 0
            },
            // 2. Faixa Amarela de Fundo (Entre 1 e 4)
            faixaAlerta: {
                type: 'box',
                yMin: 1,
                yMax: 4,
                backgroundColor: 'rgba(255, 193, 7, 0.08)', // Amarelo bem translúcido
                borderWidth: 0
            },
            // 3. Faixa Vermelha de Fundo (Acima de 4)
            faixaRisco: {
                type: 'box',
                yMin: 4,
                backgroundColor: 'rgba(220, 53, 69, 0.08)', // Vermelho bem translúcido
                borderWidth: 0
            },

async function esperarImagensCarregarem(elemento) {
    const imagens = elemento.querySelectorAll("img");
    const promessas = [];

    imagens.forEach(img => {
        if (!img.complete) {
            promessas.push(new Promise(resolve => {
                img.onload = img.onerror = resolve;
            }));
        }
    });

    await Promise.all(promessas);
}





const CORES = { 0: '#e0e0e0', safe: '#2e7d32', alerta: '#fbc02d', risco: '#d32f2f' };

function getCor(v) {

    if (v === null || v === undefined) return CORES[0];

    // 🔵 LÓGICA PARA ALBOPICTUS (presença absoluta)
    if (state.indice === 'alb') {
        if (v === 0) return CORES.safe;      // ausência
        if (v <= 3) return CORES.alerta;    // presença moderada
        return CORES.risco;                 // alta presença
    }

    // 🟢 LÓGICA OFICIAL MS (IIP e IB)
    if (v === 0) return CORES[0];
    return v < 1 ? CORES.safe : v < 4 ? CORES.alerta : CORES.risco;
}
async function carregarDados() {
    try {
        const res = await fetch("LIRAa Dados.xlsx");
        const wb = XLSX.read(await res.arrayBuffer(), { type: "array" });

        wb.SheetNames.forEach(name => {
            const ano = name.replace("LIRA_", "");
            const raw = XLSX.utils.sheet_to_json(wb.Sheets[name], { header: 1 });
            state.dados[ano] = {}; state.meta[ano] = [];

            let isPostF = false;
            raw.slice(1).forEach(row => {
                if (row[0] === 'F') { isPostF = true; return; }
                if (!isPostF && row[1]) {
                    const b = row[1].trim().toUpperCase();
                    state.dados[ano][b] = [];
                    for (let i = 2; i < row.length; i += 3) {
                        state.dados[ano][b].push({
                            iip: parseFloat(row[i]   || 0),
                            bre: parseFloat(row[i+1] || 0),
                            alb: parseFloat(row[i+2] || 0)
                        });
                    }
                } else if (isPostF && String(row[0]).startsWith('C')) {
                    state.meta[ano].push({ id: row[0], inicio: row[1], fim: row[2] });
                }
            });
        });

        initCiclos();
        renderMosaico();
    } catch(e) {
        console.error("Erro ao carregar dados:", e);
        document.getElementById('mosaico').innerHTML = '<p class="text-center text-danger mt-5">Erro ao carregar os dados do Excel.</p>';
    }
}

async function renderMosaico() {
    // Incrementa a "senha" a cada clique/chamada nova
    renderToken++;
    const currentToken = renderToken;

    const container = document.getElementById('mosaico');

    // 1. Destrói as instâncias antigas do Leaflet
    if (state.mapas) {
        Object.values(state.mapas).forEach(mapa => {
            if (mapa && typeof mapa.remove === 'function') {
                mapa.remove(); 
            }
        });
    }
    state.mapas = {};
    container.innerHTML = '';

    if (state.tipo !== 'espacial') return;

    // Busca o mapa base (isso leva alguns milissegundos, é aqui que o bug acontecia)
    const geoRes = await fetch("bairros_cg.geojson");
    const geojson = await geoRes.json();
    state.lastGeojson = geojson;

    // A MÁGICA ANTI-CLONE: Se o usuário clicou em algo e a senha mudou, aborta!
    if (currentToken !== renderToken) return;

    // 2. Ordem original restaurada (crescente: 2015, 2016... 2026)
    let anosOrdenados = Object.keys(state.meta).sort((a, b) => a - b);

    // Regra para não mostrar 2026 no consolidado anual
    if (state.ciclo === 'ANO') {
        anosOrdenados = anosOrdenados.filter(ano => ano !== '2026');
    }

    for (const ano of anosOrdenados) {
        // MAIS UMA CHECAGEM: Se mudou no meio do loop, aborta o resto
        if (currentToken !== renderToken) return;

        if (!state.dados[ano]) continue;

        const ciclosDoAno = state.meta[ano] || [];
        const semCiclo = state.ciclo !== 'ANO' && (!ciclosDoAno[state.ciclo]);

        let somaIndice = 0;
        let countBairrosComDados = 0;

        Object.keys(state.dados[ano]).forEach(bairro => {
            const d = state.dados[ano][bairro];
            let v = null;

            if (!semCiclo && d && d.length > 0) {
                if (state.ciclo === 'ANO') {
                    let s = 0; 
                    d.forEach(c => s += c[state.indice] || 0);
                    v = (state.indice === 'alb') ? s : (s / d.length);
                } else {
                    v = d[state.ciclo] ? d[state.ciclo][state.indice] : null;
                }
                
                if (v !== null) {
                    somaIndice += v;
                    countBairrosComDados++;
                }
            }
        });
        
        // ... (seu código de criar o card continua normal a partir daqui) ...


        // Se for Albopictus, o card mostra a SOMA de todos os bairros. Se não, mostra a MÉDIA.
const valorFinalCard = (state.indice === 'alb') 
    ? somaIndice.toFixed(0) 
    : (countBairrosComDados > 0 ? (somaIndice / countBairrosComDados).toFixed(1) : "0.0");

const mediaAno = valorFinalCard;

        const card = document.createElement('div');
        card.className = 'mapa-ano-card';
        card.style.position = 'relative';
        card.innerHTML = `
            <div class="mapa-ano-header">${ano}</div>
            
            <div class="valor-indice-badge" style="background: ${getCor(parseFloat(mediaAno))}">${mediaAno}</div>
            
            <div id="map-${ano}" class="mini-map" style="${semCiclo ? 'filter: blur(3px);' : ''}"></div>
            
           ${semCiclo ? `<div style="position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);color:red;font-weight:bold;font-size:0.9rem;z-index:1000;">SEM CICLO</div>` : ''}


            <div class="bairros-visitados-info">Bairros: ${countBairrosComDados}</div>

            <div class="resumo-status">
    <div class="status-item status-safe">
        <div class="numero" id="s-${ano}">0</div>
        <div>${state.indice === 'alb' ? 'Ausência' : 'Satisfatório'}</div>
    </div>
    <div class="status-item status-alerta">
        <div class="numero" id="a-${ano}">0</div>
        <div>${state.indice === 'alb' ? 'Moderado' : 'Alerta'}</div>
    </div>
    <div class="status-item status-risco">
        <div class="numero" id="r-${ano}">0</div>
        <div>${state.indice === 'alb' ? 'Alta Presença' : 'Risco'}</div>
    </div>
</div>
        `;
        container.appendChild(card);

        const map = L.map(`map-${ano}`, {
            zoomControl: false,
            attributionControl: false,
            dragging: false,
            scrollWheelZoom: false,
            touchZoom: false,
            doubleClickZoom: false, // ADICIONADO ZOOM FIXO
            boxZoom: false          // ADICIONADO ZOOM FIXO
        });

        if (!semCiclo) {
                        let safe = 0, alerta = 0, risco = 0;
            const layer = L.geoJSON(geojson, {
                style: f => {
    const b = f.properties.Name?.toUpperCase()?.trim();
    const d = state.dados[ano]?.[b];
    let v = null;

    const ciclosExistem = state.ciclo === 'ANO' || 
        (state.meta[ano] && state.meta[ano][state.ciclo] !== undefined);

    if (d && d.length > 0 && ciclosExistem) {
        if (state.ciclo === 'ANO') {
            let s = 0;
            d.forEach(c => s += c[state.indice] || 0);
            v = (state.indice === 'alb') ? s : (s / d.length);
        } else {
            v = d[state.ciclo]?.[state.indice] ?? null;
        }
    }

    // ✅ CONTADOR RESTAURADO (COM VERIFICAÇÃO DE CICLO)
    if (v !== null && ciclosExistem) {
        if (state.indice === 'alb') {
            if (v === 0) safe++;
            else if (v <= 3) alerta++;
            else risco++;
        } else {
            if (v < 1) safe++;
            else if (v < 4) alerta++;
            else risco++;
        }
    }

    return {
        fillColor: (ciclosExistem ? getCor(v) : '#ccc'),
        weight: 1,              // contorno mais nítido
        opacity: 1,
        color: '#444',
        fillOpacity: ciclosExistem ? 0.85 : 0.4,
        smoothFactor: 0         // 🔥 mantém contorno perfeito
    };
},
                onEachFeature: (f, layer) => {
                    // ... mantém seu onEachFeature como está ...
                    const ciclosExistem = state.ciclo === 'ANO' || (state.meta[ano] && state.meta[ano][state.ciclo] !== undefined);
                    if (!ciclosExistem) {
                        layer.bindPopup(`<b>${f.properties.Name}</b><br><span style="color:red; font-weight:bold;">SEM CICLO</span>`);
                    }
                }
            }).addTo(map);

            // O animate: false evita que o mapa "trema" ou distorça ao carregar
            map.fitBounds(layer.getBounds(), { padding: [2, 2], animate: false });

            document.getElementById(`s-${ano}`).textContent = safe;
            document.getElementById(`a-${ano}`).textContent = alerta;
            document.getElementById(`r-${ano}`).textContent = risco;
        } else {
            map.setView([ -7.2306, -35.8816 ], 12); // Centraliza Campina Grande
        }

        state.mapas[ano] = map;
    }
}

// --- FUNÇÃO AUXILIAR PARA GERAR O MAPA EM SVG (SEM LEAFLET) ---
function gerarSvgMapa(ano) {
    const geojson = state.lastGeojson;
    if (!geojson) return '';

    const w = 300;
    const h = 250;

    // --- Verificação de Ciclo ---
    const ciclosDoAno = state.meta[ano] || [];
    const semCiclo = state.ciclo !== 'ANO' && (!ciclosDoAno[state.ciclo]);

    // Se não houver ciclo, retorna apenas o SVG com a mensagem, sem desenhar os caminhos
    if (semCiclo) {
        return `<svg viewBox="0 0 ${w} ${h}" xmlns="http://www.w3.org/2000/svg" style="background:#ffffff;">
                    <text x="${w/2}" y="${h/2}" text-anchor="middle" fill="#d32f2f" font-size="20" font-weight="bold">SEM CICLO</text>
                </svg>`;
    }

    const coords = [];
    geojson.features.forEach(f => {
        if (f.geometry.type === 'Polygon') {
            f.geometry.coordinates[0].forEach(c => coords.push(c));
        } else if (f.geometry.type === 'MultiPolygon') {
            f.geometry.coordinates.forEach(poly => poly[0].forEach(c => coords.push(c)));
        }
    });

    const lons = coords.map(c => c[0]);
    const lats = coords.map(c => c[1]);
    const minLon = Math.min(...lons), maxLon = Math.max(...lons);
    const minLat = Math.min(...lats), maxLat = Math.max(...lats);

    const scale = Math.min(w / (maxLon - minLon), h / (maxLat - minLat)) * 0.9;
    const midLon = (minLon + maxLon) / 2;
    const midLat = (minLat + maxLat) / 2;

    const mapToSvg = (lon, lat) => {
        const x = (lon - midLon) * scale + w / 2;
        const y = h / 2 - (lat - midLat) * scale;
        return `${x},${y}`;
    };

    let caminhos = '';
    geojson.features.forEach(f => {
        const b = f.properties.Name?.toUpperCase()?.trim();
        const d = state.dados[ano]?.[b];
        let v = 0;

        if (d && d.length > 0) {
            if (state.ciclo === 'ANO') {
    let s = d.reduce((a, c) => a + (c[state.indice] || 0), 0);
    v = (state.indice === 'alb') ? s : (s / d.length);
} else {
    v = (d[state.ciclo]?.[state.indice] || 0);
}
        }

        const pontos = f.geometry.type === 'Polygon' ? [f.geometry.coordinates] : f.geometry.coordinates;
        pontos.forEach(poly => {
            const pathData = poly[0].map(c => mapToSvg(c[0], c[1])).join(' L ');
            caminhos += `<path d="M ${pathData} Z" fill="${getCor(v)}" stroke="#444" stroke-width="0.5" />`;
        });
    });

    return `<svg viewBox="0 0 ${w} ${h}" xmlns="http://www.w3.org/2000/svg" style="background:#ffffff;">${caminhos}</svg>`;
}

    // 🔥 FORÇA LAYOUT DESKTOP CENTRALIZADO DENTRO DO WRAPPER
    headerClone.style.boxSizing = "border-box";
    headerClone.style.width = "100%";
    headerClone.style.height = "90px";
    headerClone.style.padding = "0"; // Deixa o wrapper controlar o respiro lateral
    headerClone.style.margin = "0";
    headerClone.style.display = "flex";
    headerClone.style.alignItems = "center";
    headerClone.style.justifyContent = "space-between";
    headerClone.style.boxShadow = "none";

    // 🔥 FORÇA MOSTRAR LOGOS DE APOIO
    const apoios = headerClone.querySelector('.apoios');
    if (apoios) {
        apoios.style.display = "flex";
        apoios.style.alignItems = "center";
    }

    // 🔥 RESTAURA TAMANHO DAS LOGOS
    headerClone.querySelectorAll('.logo-gat img').forEach(img => {
        img.style.height = "140px";
        img.crossOrigin = "anonymous";
    });

    headerClone.querySelectorAll('.apoios img').forEach(img => {
        img.style.height = "50px";
        img.crossOrigin = "anonymous";
    });

    // Adiciona o cabeçalho dentro do wrapper protetor e depois na div principal
    headerWrapper.appendChild(headerClone);
    exportDiv.appendChild(headerWrapper);

    // 2. Título Dinâmico
    const nomesIndicadores = { 
        'iip': 'Infestação Predial (IIP)', 
        'bre': 'Índice de Breteau (IB)', 
        'alb': 'Aedes Albopictus' 
    };
    
    const titulo = document.createElement('h2');
    titulo.style.cssText = "text-align:center; margin:20px 0; color:#0e945c; font-size:1.4rem; font-weight:700;";
    
    if (state.tipo === 'espacial') {
        const textoCiclo = state.ciclo === 'ANO' ? ' (Consolidado Anual)' : ` (Ciclo: C${Number(state.ciclo) + 1})`;
        titulo.textContent = `Análise Espacial: ${nomesIndicadores[state.indice]}${textoCiclo}`;
    } else {
        titulo.textContent = `Análise Temporal: ${nomesIndicadores[state.indice]} (Histórico Consolidado)`;
    }
    exportDiv.appendChild(titulo);

    // 🟢 CONDICIONAL DE ALTERNÂNCIA DE ABAS NA CAPTURA
    if (state.tipo === 'espacial') {
        
        // 3. Mosaico Original (Mantido 100% Intacto)
        const mosaico = document.createElement('div');
        mosaico.style.display = 'grid';
        mosaico.style.gridTemplateColumns = 'repeat(5, 1fr)';
        mosaico.style.gap = '12px';

        const anosOrdenados = ['2015','2016','2017','2018','2019','2021','2022','2023','2024','2025'];
        
        anosOrdenados.forEach(ano => {
            if (!state.dados[ano]) return;
            
            let somaLocal = 0;
            let contBairrosLocal = 0;
            const ciclosDoAno = state.meta[ano] || [];
            const semCiclo = state.ciclo !== 'ANO' && (!ciclosDoAno[state.ciclo]);

            // Cálculo dos valores para o Card de Exportação
            Object.keys(state.dados[ano]).forEach(b => {
                const d = state.dados[ano][b];
                if (d && d.length > 0 && !semCiclo) {
                    let v = 0;
                    if (state.ciclo === 'ANO') {
                        let s = d.reduce((acc, curr) => acc + (curr[state.indice] || 0), 0);
                        v = (state.indice === 'alb') ? s : (s / d.length);
                    } else {
                        v = d[state.ciclo] ? (d[state.ciclo][state.indice] || 0) : 0;
                    }
                    somaLocal += v;
                    contBairrosLocal++;
                }
            });

            const valorFinal = (state.indice === 'alb') 
                ? somaLocal.toFixed(0) 
                : (contBairrosLocal > 0 ? (somaLocal / contBairrosLocal).toFixed(1) : "0.0");

            const card = document.createElement('div');
            card.style.cssText = "border:1px solid #ddd; border-radius:8px; overflow:hidden; display:flex; flex-direction:column; position:relative; background:white;";
            
            // Clonar rodapé de status da tela original
            const resumoOrigem = document.getElementById(`s-${ano}`);
            const resumoClone = resumoOrigem ? resumoOrigem.parentElement.parentElement.cloneNode(true) : document.createElement('div');
            
            resumoClone.style.display = 'flex';
            resumoClone.style.flexDirection = 'row';
            resumoClone.style.justifyContent = 'space-around';
            resumoClone.style.alignItems = 'center';
            resumoClone.style.width = '100%';
            resumoClone.style.padding = '5px 0';
            resumoClone.style.fontSize = '0.65rem';
            resumoClone.style.background = '#fcfcfc';

            resumoClone.querySelectorAll('.status-item').forEach(item => {
                item.style.flex = '1';
                item.style.display = 'flex';
                item.style.flexDirection = 'column';
                item.style.alignItems = 'center';
                item.style.textAlign = 'center';
            });

            resumoClone.querySelectorAll('.numero').forEach(num => {
                num.style.fontSize = '1.1rem';
                num.style.lineHeight = '1';
                num.style.marginBottom = '2px';
            });
            
            card.innerHTML = `
                <div style="background:#0e945c; color:white; text-align:center; font-weight:bold; padding:4px; font-size: 0.9rem;">${ano}</div>
                
                <div style="position:absolute; top:35px; right:5px; background:${getCor(parseFloat(valorFinal))}; color:white; padding:2px 6px; border-radius:4px; font-weight:800; font-size:0.9rem; z-index:10;">
                    ${valorFinal}
                </div>
                
                <div style="height:180px; display:flex; align-items:center; justify-content:center; background:#ffffff;">
                    ${gerarSvgMapa(ano)}
                </div>
                
                <div style="position:absolute; bottom:65px; left:5px; font-size:0.6rem; font-weight:bold; background:rgba(255,255,255,0.7); padding:1px 3px;">
                    Bairros: ${contBairrosLocal}
                </div>
            `;
            card.appendChild(resumoClone);
            mosaico.appendChild(card);
        });

        exportDiv.appendChild(mosaico);

    } else if (state.tipo === 'temporal') {
        
        // 4. Captura Segura dos Gráficos via instância do ID do Canvas (Evita loop infinito)
        const chart1 = Chart.getChart(document.getElementById("graficoST"));
        const chart2 = Chart.getChart(document.getElementById("graficoBoxplot"));
        const chart3 = Chart.getChart(document.getElementById("graficoAnual"));

        // Gráfico Grande: Série Histórica (Topo)
        const c1 = document.createElement('div');
        c1.style.cssText = "background:white; padding:20px; border:1px solid #e0e0e0; border-radius:8px; margin-bottom:25px; text-align:center; box-shadow: 0 2px 5px rgba(0,0,0,0.02);";
        c1.innerHTML = `<h4 style="font-size:1.1rem; font-weight:bold; color:#333; margin-bottom:15px; text-align:center;">Série Temporal Histórica (Todos os Ciclos)</h4>`;
        
        const img1 = document.createElement('img');
        img1.src = chart1 ? chart1.toBase64Image() : ''; 
        img1.style.width = "100%";
        img1.style.height = "auto";
        c1.appendChild(img1);
        exportDiv.appendChild(c1);

        // Grid para dispor os dois gráficos menores lado a lado (Base)
        const gridBaixo = document.createElement('div');
        gridBaixo.style.cssText = "display:grid; grid-template-columns: 1fr 1fr; gap:25px;";

        // Gráfico Esquerdo: Boxplot
        const c2 = document.createElement('div');
        c2.style.cssText = "background:white; padding:20px; border:1px solid #e0e0e0; border-radius:8px; text-align:center; box-shadow: 0 2px 5px rgba(0,0,0,0.02);";
        c2.innerHTML = `<h4 style="font-size:1.1rem; font-weight:bold; color:#333; margin-bottom:15px; text-align:center;">Distribuição por Ciclo (Boxplot)</h4>`;
        
        const img2 = document.createElement('img');
        img2.src = chart2 ? chart2.toBase64Image() : '';
        img2.style.width = "100%";
        img2.style.height = "auto";
        c2.appendChild(img2);
        gridBaixo.appendChild(c2);

        // Gráfico Direito: Média Anual Consolidada
        const c3 = document.createElement('div');
        c3.style.cssText = "background:white; padding:20px; border:1px solid #e0e0e0; border-radius:8px; text-align:center; box-shadow: 0 2px 5px rgba(0,0,0,0.02);";
        c3.innerHTML = `<h4 style="font-size:1.1rem; font-weight:bold; color:#333; margin-bottom:15px; text-align:center;">Média Anual Consolidada</h4>`;
        
        const img3 = document.createElement('img');
        img3.src = chart3 ? chart3.toBase64Image() : '';
        img3.style.width = "100%";
        img3.style.height = "auto";
        c3.appendChild(img3);
        gridBaixo.appendChild(c3);

        exportDiv.appendChild(gridBaixo);
    }

    await esperarImagensCarregarem(exportDiv);

    const canvas = await html2canvas(exportDiv, { 
        scale: 2,
        useCORS: true,
        logging: false,
        windowWidth: 1400
    });
    
    document.body.removeChild(exportDiv);
    return canvas;
}



document.getElementById('btnPng').onclick = async () => {
    const btn = document.getElementById('btnPng');
    btn.innerHTML = '<span class="spinner-border spinner-border-sm"></span> Processando...';
    const canvas = await prepararCapturaLimpa();
    const link = document.createElement('a');
    link.download = `Mapa_LIRAa_${state.indice}_Ciclo_${state.ciclo}.png`;
    link.href = canvas.toDataURL('image/png');
    link.click();
    btn.innerHTML = '<i class="bi bi-download"></i> PNG';
};

document.getElementById('btnPdf').onclick = async () => {
    const btn = document.getElementById('btnPdf');
    // Salva o texto original para restaurar depois
    const textoOriginal = btn.innerHTML; 
    btn.innerHTML = '<span class="spinner-border spinner-border-sm"></span> Gerando PDF...';

    try {
        // Chama a sua função original que cria a div temporária de captura
        const canvas = await prepararCapturaLimpa();
        const imgData = canvas.toDataURL('image/png');
        
        // Cria o PDF em modo Paisagem (Landscape), unidade milímetros, papel A4
        const pdf = new jspdf.jsPDF('l', 'mm', 'a4');
        
        // Pega as dimensões exatas da folha A4 em modo paisagem (297mm x 210mm)
        const pdfWidth = pdf.internal.pageSize.getWidth(); // 297
        const pdfHeight = pdf.internal.pageSize.getHeight(); // 210

        // Pega as dimensões da imagem capturada
        const imgProps = pdf.getImageProperties(imgData);
        
        // Calcula a altura proporcional que a imagem teria se ocupasse a largura total da folha
        let renderWidth = pdfWidth;
        let renderHeight = (imgProps.height * pdfWidth) / imgProps.width;

        // 🚨 O PULO DO GATO: Se a altura calculada for maior que a folha A4 (comum na aba Temporal)
        if (renderHeight > pdfHeight) {
            // Reduz a escala baseado na altura para caber perfeitamente na página sem cortar
            renderHeight = pdfHeight - 10; // 10mm de margem de segurança
            renderWidth = (imgProps.width * renderHeight) / imgProps.height;
        }

        // Centraliza a imagem na folha caso ela precise ser encolhida
        const xOffset = (pdfWidth - renderWidth) / 2;
        const yOffset = (pdfHeight - renderHeight) / 2;

        // Adiciona a imagem perfeitamente dimensionada e centralizada
        pdf.addImage(imgData, 'PNG', xOffset, yOffset, renderWidth, renderHeight);
        pdf.save(`Relatorio_LIRAa_${state.indice}.pdf`);

    } catch (error) {
        console.error("Erro ao gerar PDF:", error);
        alert("Ocorreu um erro ao gerar o PDF. Verifique o console.");
    } finally {
        // Restaura o botão original independente de dar certo ou erro
        btn.innerHTML = textoOriginal; 
    }
};
// Listener para redimensionamento e carregamento inicial
window.addEventListener('resize', () => {
    Object.values(state.mapas).forEach(m => m && m.invalidateSize());
});

carregarDados();
